# Portas publicadas no host (evitar conflito com outros stacks):
#   API:   28471 -> 3000
#   Web:   36284 -> 80
#
# API usa SQLite (volume `junny_sqlite`). PostgreSQL é opcional no futuro.
# Nginx no servidor deve apontar para 127.0.0.1 nessas portas (ver infra/nginx/).

services:
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    ports:
      - '28471:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      SQLITE_PATH: /app/data/junny.sqlite
    volumes:
      - junny_sqlite:/app/data
    networks:
      - junny-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '36284:80'
    networks:
      - junny-network

volumes:
  junny_sqlite:

networks:
  junny-network:
    driver: bridge
