# Junny — ambiente de desenvolvimento (MD15)
# Uso: docker compose up  (ou: docker compose up --build)
#
# Depois: abrir http://localhost:${WEB_PORT:-20052} — a API fica em http://localhost:${SERVER_PORT:-20053}
# Comunicação entre contentores (ex. futuro SSR): host interno do serviço `server` → http://server:20053
#
# SQLite: volume nomeado (não comitar). Opcional mapear ./data no host: descomentar em volumes do serviço server.

name: junny-dev

services:
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile.dev
    restart: unless-stopped
    ports:
      - '${SERVER_PORT:-20053}:20053'
    environment:
      PORT: '20053'
      NODE_ENV: development
      DATABASE_URL: file:/app/data/dev.db
    volumes:
      - .:/repo
      - junny_repo_node_modules:/repo/node_modules
      # Evita usar node_modules do host (darwin) dentro do container (linux)
      - /repo/apps/server/node_modules
      - junny_sqlite_dev:/app/data
    networks:
      - junny-network

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile.dev
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-20052}:20052'
    environment:
      CHOKIDAR_USEPOLLING: '${CHOKIDAR_USEPOLLING:-true}'
      WATCHPACK_POLLING: '${WATCHPACK_POLLING:-true}'
    volumes:
      - .:/repo
      - junny_repo_node_modules:/repo/node_modules
      # Evita usar node_modules do host (darwin) dentro do container (linux)
      - /repo/apps/web/node_modules
    depends_on:
      - server
    networks:
      - junny-network

volumes:
  junny_repo_node_modules:
  junny_sqlite_dev:

networks:
  junny-network:
    name: junny-network
    driver: bridge
