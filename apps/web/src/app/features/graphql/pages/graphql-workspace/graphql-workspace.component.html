<div
  class="flex h-dvh min-h-0 flex-col bg-junny-bg text-slate-100 selection:bg-junny-violet/25"
>
  <app-workspace-app-header contextLabel="GraphQL workspace">
    @if (loading()) {
      <span workspaceHeaderEnd class="text-xs text-junny-blue">Sending…</span>
    }
  </app-workspace-app-header>

  <div class="flex min-h-0 flex-1 flex-col md:flex-row">
    <app-workspace-sidebar
      class="shrink-0 border-b border-white/10 md:border-b-0"
      [collections]="collections()"
      [environments]="environments()"
      [selectedEnvironmentId]="ui.selectedEnvironmentId()"
      [expandedCollectionId]="ui.expandedCollectionId()"
      [collectionRequests]="expandedRequests()"
      [historyReloadTick]="historyReloadTick()"
      (envChange)="onEnvChange($event)"
      (openEnvCreate)="openEnvironmentCreate()"
      (openEnvEdit)="openEnvironmentEdit($event)"
      (toggleCollection)="toggleCollection($event)"
      (loadStored)="loadStoredRequest($event)"
      (deleteStoredRequest)="onDeleteStoredRequest($event)"
      (replayHistory)="onReplayHistory($event)"
      (newCollection)="newCollection()"
      (duplicateCollection)="duplicateCollection($event)"
      (renameCollection)="renameCollection($event)"
      (deleteCollection)="deleteCollection($event)"
      (editCollectionAuth)="editCollectionAuth($event)"
    />

    <div class="flex min-w-0 min-h-0 flex-1 flex-col">
      <div class="shrink-0 border-b border-white/5 px-2 pt-2">
        <app-request-tabs
          [tabs]="gql.tabs()"
          [activeId]="gql.activeTabId()"
          (tabSelected)="onSelectTab($event)"
          (tabClosed)="onCloseTab($event)"
          (tabAdded)="addTab()"
        />
      </div>

      <div
        class="grid min-h-0 flex-1 grid-rows-1 gap-0 overflow-hidden md:grid-cols-1 md:grid-rows-[minmax(0,1.15fr)_minmax(0,0.85fr)]"
      >
        <div class="min-h-0 space-y-4 overflow-y-auto p-4">
          @if (activeTab(); as tab) {
            <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
              <div class="min-w-0 flex-1">
                <label
                  class="mb-1 block text-xs text-slate-500"
                  for="gql-url"
                  >Endpoint</label
                >
                <input
                  id="gql-url"
                  type="url"
                  class="w-full rounded-xl border border-white/10 bg-slate-900 px-3 py-2 font-mono text-sm text-slate-100 placeholder:text-slate-600 focus:border-junny-violet/50 focus:outline-none"
                  [value]="tab.url"
                  (input)="updateUrl($any($event.target).value)"
                  placeholder="https://api.example.com/graphql"
                />
              </div>
              <div class="flex flex-wrap gap-2">
                <button
                  type="button"
                  class="rounded-xl border border-white/15 bg-slate-900/80 px-4 py-2 text-sm text-slate-200 transition hover:border-junny-violet/40 hover:text-white"
                  (click)="insertIntrospection()"
                >
                  Introspection
                </button>
                <button
                  type="button"
                  class="rounded-xl bg-junny-blue px-5 py-2 text-sm font-semibold text-white shadow-lg shadow-junny-blue/20 transition hover:bg-blue-600 disabled:opacity-40"
                  [disabled]="loading()"
                  (click)="send()"
                >
                  Send
                </button>
              </div>
            </div>

            <app-key-value-table
              label="Headers"
              [rows]="tab.headerRows"
              (rowsChange)="onHeadersChange($event)"
            />

            <app-authorization-editor
              [auth]="tab.auth"
              (authChange)="onAuthChange($event)"
            />

            <app-graphql-query-editor
              [value]="tab.queryText"
              (valueChange)="onQueryChange($event)"
            />

            <app-body-editor
              label="Variables (JSON)"
              [value]="tab.variablesText"
              (valueChange)="onVariablesChange($event)"
            />

            <div
              class="flex flex-wrap items-center gap-2 rounded-xl border border-white/10 bg-slate-950/50 p-3"
            >
              <span class="text-xs text-slate-500">Save to collection</span>
              <select
                class="rounded-lg border border-white/10 bg-slate-900 px-2 py-1.5 text-sm"
                [value]="saveCollectionId()"
                (change)="saveCollectionId.set($any($event.target).value)"
              >
                <option value="">Selecionar…</option>
                @for (c of collections(); track c.id) {
                  <option [value]="c.id">{{ c.name }}</option>
                }
              </select>
              <button
                type="button"
                class="rounded-lg border border-white/10 px-3 py-1.5 text-sm hover:border-junny-violet/40"
                [disabled]="!saveCollectionId()"
                (click)="saveToCollection()"
              >
                Save
              </button>
            </div>
          }
        </div>

        <div class="min-h-0 border-t border-white/10 p-4">
          @if (graphqlErrors(); as errs) {
            <div
              class="mb-3 rounded-xl border border-rose-500/30 bg-rose-950/40 px-3 py-2 text-xs text-rose-200"
            >
              <p class="mb-1 font-semibold text-rose-300">GraphQL errors</p>
              <pre class="max-h-32 overflow-auto whitespace-pre-wrap font-mono text-[11px]">{{ errs | json }}</pre>
            </div>
          }
          <app-response-viewer
            [res]="response()"
            [errorText]="errorMessage()"
          />
        </div>
      </div>
    </div>
  </div>

  <app-environment-editor-modal
    [open]="envModalOpen()"
    [mode]="envModalMode()"
    [environmentId]="envModalEditingId()"
    (closed)="envModalOpen.set(false)"
    (saved)="onEnvironmentSaved()"
  />
</div>
