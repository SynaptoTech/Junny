<div class="flex h-dvh min-h-0 flex-col bg-junny-bg text-slate-100 selection:bg-junny-violet/25">
  <app-workspace-app-header contextLabel="Team · Members" />

  <main class="mx-auto w-full max-w-4xl flex-1 p-4 md:p-6">
    <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <h1 class="text-lg font-semibold text-slate-100">Workspaces</h1>
        @if (loading()) {
          <span class="text-xs text-slate-500">Carregando…</span>
        }
      </div>
      <button
        type="button"
        class="rounded-xl border border-white/15 bg-slate-900/70 px-3 py-2 text-sm text-slate-200 hover:border-junny-violet/40"
        (click)="createWorkspace()"
      >
        + Novo workspace
      </button>
    </div>

    @if (error(); as err) {
      <div class="mb-4 rounded-xl border border-rose-500/25 bg-rose-950/25 px-4 py-3 text-sm text-rose-100">
        {{ err }}
      </div>
    }

    <section class="grid gap-4 md:grid-cols-[18rem_1fr]">
      <div class="rounded-2xl border border-white/10 bg-slate-950/40 p-3">
        <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-500">Meus workspaces</p>
        <div class="space-y-1">
          @for (w of workspaces(); track w.id) {
            <button
              type="button"
              class="flex w-full items-center justify-between gap-2 rounded-xl border px-3 py-2 text-left text-sm transition"
              [ngClass]="
                w.id === selectedWorkspaceId()
                  ? 'border-junny-blue/40 bg-junny-blue/10 text-slate-100'
                  : 'border-white/10 bg-slate-950/30 text-slate-300 hover:border-white/20 hover:text-white'
              "
              (click)="selectWorkspace(w.id)"
            >
              <span class="truncate">{{ w.name }}</span>
              <span class="shrink-0 rounded-lg border border-white/10 bg-slate-900/60 px-2 py-0.5 text-[11px] text-slate-300">
                {{ w.role }}
              </span>
            </button>
          } @empty {
            <p class="text-sm text-slate-500">Nenhum workspace ainda.</p>
          }
        </div>
      </div>

      <div class="rounded-2xl border border-white/10 bg-slate-950/40 p-4">
        <app-team-workspace-detail [workspace]="selectedWorkspace()" />
      </div>
    </section>
  </main>
</div>

<app-prompt-dialog
  [open]="createWsPromptOpen()"
  title="Novo workspace"
  label="Nome do workspace"
  placeholder="Ex.: Personal, Projeto X…"
  confirmLabel="Criar"
  cancelLabel="Cancelar"
  [maxlength]="80"
  (confirmed)="onCreateWorkspaceConfirmed($event)"
  (cancelled)="onCreateWorkspaceCancelled()"
/>
