<header
  class="sticky top-0 z-50 border-b border-white/5 bg-junny-bg/85 backdrop-blur-md"
>
  <div
    class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4 sm:px-6"
  >
    <a class="flex items-center gap-3" href="/" [attr.aria-label]="brand.name + ' home'">
      <img
        class="h-8 w-auto sm:h-9"
        src="images/logo.png"
        [alt]="brand.name"
        width="120"
        height="40"
      />
    </a>
    <nav class="flex flex-wrap items-center justify-end gap-2 sm:gap-3" aria-label="Primary">
      <app-button variant="secondary" [href]="brand.urls.github" [external]="true">
        GitHub
      </app-button>
      <app-button variant="primary" [href]="brand.urls.docs" [external]="true">
        Documentation
      </app-button>
      <button
        type="button"
        disabled
        title="Theme toggle — coming soon"
        class="cursor-not-allowed rounded-xl border border-white/10 px-3 py-2 text-xs font-medium text-slate-500 opacity-70"
        aria-disabled="true"
      >
        Theme
      </button>
    </nav>
  </div>
</header>
