<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    class="inline-flex items-center gap-1.5 rounded-xl border border-white/10 bg-slate-950/40 px-2.5 py-2 text-xs font-medium text-slate-300 ring-1 ring-white/5 transition hover:border-white/20 hover:bg-slate-950/55 hover:text-slate-100"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    aria-label="Language"
  >
    <span class="text-slate-500" aria-hidden="true">
      <svg
        class="h-3.5 w-3.5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
      >
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18M12 3a15 15 0 0 0 0 18M12 3a15 15 0 0 1 0 18" />
      </svg>
    </span>
    <span>{{ currentLabel() }}</span>
    <span
      class="text-[10px] text-slate-500 transition"
      [ngClass]="open() ? 'rotate-180' : ''"
      aria-hidden="true"
      >▾</span
    >
  </button>

  @if (open()) {
    <div
      class="absolute right-0 z-[60] mt-1.5 min-w-[11rem] overflow-hidden rounded-xl border border-white/10 bg-slate-950/95 py-1 shadow-xl shadow-black/40 ring-1 ring-white/10 backdrop-blur-xl"
      role="listbox"
      aria-label="Languages"
    >
      @for (loc of locales; track loc.id) {
        <a
          role="option"
          [attr.aria-selected]="isActive(loc)"
          [routerLink]="localeRouterLink(loc)"
          (click)="selectLocale(loc)"
          class="block px-3 py-2 text-sm transition"
          [ngClass]="
            isActive(loc)
              ? 'bg-white/10 text-white'
              : 'text-slate-300 hover:bg-white/5 hover:text-slate-100'
          "
        >
          {{ loc.label }}
        </a>
      }
    </div>
  }
</div>
