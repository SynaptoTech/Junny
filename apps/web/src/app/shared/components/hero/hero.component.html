<section
  class="mx-auto max-w-6xl px-4 pb-8 pt-12 sm:px-6 sm:pb-12 sm:pt-16"
  aria-labelledby="hero-heading"
>
  <div class="grid items-center gap-12 lg:grid-cols-2 lg:gap-10">
    <div class="space-y-6 motion-safe:animate-[fade-up_0.55s_ease-out_both]">
      <p
        class="inline-flex items-center gap-2 rounded-full border border-junny-violet/25 bg-junny-violet/10 px-3 py-1 text-xs font-medium text-violet-100"
      >
        <span class="h-1.5 w-1.5 rounded-full bg-junny-violet"></span>
        Early development
      </p>
      <div class="space-y-3">
        <h1
          id="hero-heading"
          class="text-4xl font-semibold tracking-tight text-slate-50 sm:text-5xl"
        >
          {{ brand.slogan }}
        </h1>
        <p class="max-w-xl text-lg leading-relaxed text-slate-400">
          {{ brand.description }}
        </p>
      </div>
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
        <app-button variant="primary" [href]="brand.urls.github" [external]="true">
          View on GitHub
        </app-button>
        <app-button variant="secondary" [href]="brand.urls.docs" [external]="true">
          Documentation
        </app-button>
      </div>
      <p class="text-sm text-slate-500">
        MIT · Open source · Web-first · Dark mode by default
      </p>
    </div>

    <div class="relative motion-safe:animate-[fade-up_0.65s_ease-out_both]">
      <div
        class="absolute -inset-4 rounded-3xl bg-gradient-to-tr from-junny-blue/25 to-junny-violet/25 opacity-70 blur-3xl"
        aria-hidden="true"
      ></div>
      <div
        class="relative overflow-hidden rounded-2xl border border-white/10 bg-slate-900/60 shadow-2xl shadow-black/40 ring-1 ring-white/5"
      >
        <div
          class="flex items-center justify-between border-b border-white/5 bg-slate-900/80 px-4 py-3"
        >
          <div class="flex items-center gap-2" aria-hidden="true">
            <span class="h-2.5 w-2.5 rounded-full bg-rose-400/90"></span>
            <span class="h-2.5 w-2.5 rounded-full bg-amber-400/90"></span>
            <span class="h-2.5 w-2.5 rounded-full bg-emerald-400/90"></span>
          </div>
          <p class="text-xs text-slate-500">junny — preview</p>
        </div>
        <div class="space-y-4 p-4 sm:p-5">
          <div class="flex flex-wrap items-center gap-2">
            <span
              class="rounded-md bg-junny-blue/15 px-2 py-1 text-xs font-medium text-blue-100"
              >GET</span
            >
            <span class="font-mono text-sm text-slate-300"
              >https://api.example.com/v1/health</span
            >
          </div>
          <div class="grid gap-3 sm:grid-cols-2">
            <div class="rounded-lg border border-white/5 bg-slate-950/50 p-3">
              <p class="text-xs text-slate-500">Environment</p>
              <p class="mt-1 text-sm text-slate-200">production</p>
            </div>
            <div class="rounded-lg border border-white/5 bg-slate-950/50 p-3">
              <p class="text-xs text-slate-500">Status</p>
              <p class="mt-1 text-sm text-emerald-300">200 OK</p>
            </div>
          </div>
          <pre
            class="overflow-x-auto rounded-lg border border-white/5 bg-slate-950/80 p-3 text-left text-xs leading-relaxed text-slate-300"
            ><code>{{ previewBody() }}</code></pre
          >
        </div>
      </div>
    </div>
  </div>
</section>
