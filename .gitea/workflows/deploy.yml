# Deploy Junny — Tools/Junny (Gitea)
# Pipeline desmembrada: prepare → sync-code → remote-docker → verify.
# Runner: ubuntu-latest + ghcr.io/catthehacker/ubuntu:act-22.04. TLS: **NPM** (sem Nginx/Certbot no SO).
# Portas no host: **20052** web (Nginx estático) · **20053** API Nest (`GET /v1/health`).
#
# Secrets: SSH_KEY, SSH_USER, SSH_HOST, APP_DIR, JWT_SECRET
# Opcional: JUNNY_WEB_HOST_PORT, JUNNY_API_HOST_PORT

name: junny-deploy-pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instala openssh-client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client

      - name: Configura SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t ed25519,ecdsa,rsa -T 15 -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Testa conexão SSH
        shell: bash
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i ~/.ssh/id_rsa "${SSH_USER}@${SSH_HOST}" "echo SSH_OK"

  sync-code:
    needs: [prepare]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instala openssh-client e rsync
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client rsync

      - name: Configura SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t ed25519,ecdsa,rsa -T 15 -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Envia código (incremental)
        shell: bash
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa "${SSH_USER}@${SSH_HOST}" "
            set -e
            sudo mkdir -p \"$APP_DIR\"
            sudo chown -R \"$SSH_USER:$SSH_USER\" \"$APP_DIR\"
            sudo chmod -R u+rwX,g+rX,o+rX \"$APP_DIR\"
          "
          rsync -az -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i $HOME/.ssh/id_rsa" --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.angular' \
            --exclude='dist' \
            --exclude='.env' \
            . "${SSH_USER}@${SSH_HOST}:${APP_DIR}/"

  remote-docker:
    needs: [sync-code]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instala openssh-client e Python
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client python3

      - name: Configura SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t ed25519,ecdsa,rsa -T 15 -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Gera .env remoto e Docker Compose
        shell: bash
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          APP_DIR: ${{ secrets.APP_DIR }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JUNNY_WEB_HOST_PORT: ${{ secrets.JUNNY_WEB_HOST_PORT }}
          JUNNY_API_HOST_PORT: ${{ secrets.JUNNY_API_HOST_PORT }}
        run: |
          set -euo pipefail
          python3 infra/scripts/write-deploy-env.py
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa "${SSH_USER}@${SSH_HOST}" "cat > \"$APP_DIR/.env\"" < .deploy-env
          rm -f .deploy-env
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa "${SSH_USER}@${SSH_HOST}" "
            set -e
            cd \"$APP_DIR\"
            docker compose -f docker-compose.prod.yml build --parallel
            docker compose -f docker-compose.prod.yml --env-file .env up -d --force-recreate --remove-orphans
            docker image prune -f
          "

  verify:
    needs: [remote-docker]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - name: Instala openssh-client e curl
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client curl

      - name: Configura SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t ed25519,ecdsa,rsa -T 15 -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Verifica deploy
        shell: bash
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa "${SSH_USER}@${SSH_HOST}" "
            echo '=== Containers ===' &&
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' &&
            echo '' &&
            echo '=== Web 20052 ===' &&
            (curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:20052/ && echo OK) || echo 'Aviso: web 20052' &&
            echo '=== API 20053 /v1/health ===' &&
            (curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:20053/v1/health && echo OK) || echo 'Aviso: API 20053'
          "
